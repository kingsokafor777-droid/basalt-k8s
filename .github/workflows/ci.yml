name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Quality checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Basalt Core from source
        run: pip install "basalt-core @ git+https://github.com/kingsokafor777-droid/basalt-core@3b57faa4d92fbeebc505da8e8597e3627dcd0f9d"
      - name: Install Kubernetes scanner and development dependencies
        run: pip install -e ".[dev]"
      - name: Lint, type-check, and test
        run: make check

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build source and wheel distributions
        run: pipx run build
      - name: Verify distribution metadata
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
