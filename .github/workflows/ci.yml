name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Quality checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Basalt Core from source
        run: pip install "basalt-core @ git+https://github.com/kingsokafor777-droid/basalt-core@main"
      - name: Install Kubernetes scanner and development dependencies
        run: pip install -e ".[dev]"
      - name: Lint, type-check, and test
        run: make check

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build source and wheel distributions
        run: pipx run build
      - name: Verify distribution metadata
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
