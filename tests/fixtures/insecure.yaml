apiVersion: v1
kind: Namespace
metadata:
  name: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wildcard-reader
  namespace: production
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: application-superuser
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: application
    namespace: production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-api
  namespace: production
spec:
  selector:
    matchLabels:
      app: insecure-api
  template:
    metadata:
      labels:
        app: insecure-api
    spec:
      hostNetwork: true
      securityContext:
        runAsNonRoot: false
      containers:
        - name: api
          image: example/api:latest
          securityContext:
            privileged: true
