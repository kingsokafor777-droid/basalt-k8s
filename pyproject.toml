[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "basalt-k8s"
version = "0.1.0"
description = "Kubernetes posture scanner for RBAC, Pod Security Standards, and NetworkPolicy, emitting normalized Basalt findings and SARIF."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Kingsley Okafor" }]
keywords = ["kubernetes", "k8s", "yaml", "rbac", "pod-security", "network-policy", "security", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "basalt-core>=0.1.1,<1",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
]

[project.scripts]
basalt-k8s = "basalt_k8s.cli:main"

# Discovered by basalt-core; this is what makes `basalt scanners` list us.
[project.entry-points."basalt.scanners"]
k8s = "basalt_k8s.scanner:KubernetesScanner"

[project.urls]
Homepage = "https://github.com/kingsokafor777-droid/basalt-k8s"
Source = "https://github.com/kingsokafor777-droid/basalt-k8s"
Issues = "https://github.com/kingsokafor777-droid/basalt-k8s/issues"
Changelog = "https://github.com/kingsokafor777-droid/basalt-k8s/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/basalt_k8s"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH"]
# UP042/UP017: 3.11-only constructs; the floor here matches basalt-core at 3.10.
ignore = ["N818", "RUF012", "A003", "RUF022", "UP042", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PTH", "S101"]
# ARG002: Check.run's signature is fixed by the ABC; static checks accept the shared context.
"src/basalt_k8s/checks/*" = ["ARG002"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src/basalt_k8s"]

[[tool.mypy.overrides]]
module = ["yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["integration: exercises an external Kubernetes tool; deselected by default"]

[tool.coverage.run]
source = ["basalt_k8s"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
fail_under = 80
